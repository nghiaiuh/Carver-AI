name: Security checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TypeScript resolves workspace declarations from dist/ in a clean runner.
      # Keep this workflow independent from the broader quality job.
      - run: npm run build --workspace @carver/shared
      - run: npm run build --workspace @carver/db
      - run: npm run build --workspace @carver/queue
      - run: npm run build --workspace @carver/storage
      - run: npm run build --workspace @carver/ai
      - run: npm run typecheck
      - run: npm run test --workspace @carver/shared

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
