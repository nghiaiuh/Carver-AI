name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Non-secret values required only while compiling Next.js configuration.
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      NEXT_PUBLIC_LANDING_ASSET_BASE_URL: https://ci-assets.carver.example
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      REDIS_URL: rediss://default:ci-password@localhost:6379
      ASSET_GATEWAY_SIGNING_SECRET: ci-signing-secret-at-least-32-characters
      CLOUDFLARE_R2_ACCOUNT_ID: ci-account
      CLOUDFLARE_R2_ACCESS_KEY_ID: ci-access-key
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ci-secret-key
      CLOUDFLARE_R2_BUCKET: ci-private-bucket
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:canvas-workflow --workspace @carver/web
      - run: npm run test:prompt-engine
      - run: npm run test --workspace @carver/shared
      - run: npm run test --workspace @carver/queue
      - run: npm run test:openai-contracts --workspace @carver/worker
      - run: npm run test:image-generator --workspace @carver/worker
      - run: npm run test --workspace @carver/worker
      - run: npm run security:api-boundaries
      - run: npm run migration:validate
      - run: npm run build

  dependency-audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # Dependabot opens remediation PRs. Keep this visible without turning an
      # advisory update into an unrelated deployment outage.
      - run: npm audit --omit=dev --audit-level=high
